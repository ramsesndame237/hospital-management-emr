# Environnement local / démo : PostgreSQL + API. Les secrets viennent d'un fichier .env (voir .env.example), jamais du dépôt.
#   docker compose up --build
# Le schéma est chargé au premier démarrage depuis migration/schema/schema.pg.sql (déduit du code C#).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-sanjeevani}
      POSTGRES_USER: ${DB_USER:-sanjeevani}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est obligatoire (voir .env.example)}
    volumes:
      # PostgreSQL 18+ : le répertoire de données est /var/lib/postgresql/18/docker ; le volume se monte donc sur le parent.
      - pgdata:/var/lib/postgresql
      - ./migration/schema/schema.pg.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sanjeevani} -d ${DB_NAME:-sanjeevani}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sessions et cache. Mot de passe obligatoire, aucun port publié : seul le réseau Docker interne y accède.
  # Pas de persistance (--save ""): les sessions sont éphémères, une perte de Redis déconnecte simplement tout le monde.
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire (voir .env.example)}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sanjeevani}
      DB_USER: ${DB_USER:-sanjeevani}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET est obligatoire (32 caractères minimum)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY est obligatoire (32 octets en base64, voir .env.example)}
      LEGACY_PASSWORD_SALT: ${LEGACY_PASSWORD_SALT:-}
      # Mettre false uniquement pour un essai local en HTTP ; en production l'API refuse de démarrer avec false.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BREACH_CHECK_ENABLED: ${BREACH_CHECK_ENABLED:-true}
      # Documentation interactive (/api-docs, connexion + permission api.docs:read). Fermée par défaut ; mettre true en démo.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      I18N_ADAPTER: ${I18N_ADAPTER:-nestjs-i18n}
      I18N_LOCALES: ${I18N_LOCALES:-fr,en}
      I18N_DEFAULT_LOCALE: ${I18N_DEFAULT_LOCALE:-fr}
    ports:
      - "3000:3000"

volumes:
  pgdata:
